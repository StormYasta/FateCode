services:
  postgres:
    image: postgres:16-alpine
    container_name: fatecode_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fatecode
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fatecode"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fatecode_network

  redis:
    image: redis:7-alpine
    container_name: fatecode_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fatecode_network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: fatecode_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fatecode?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: supersecret_fatecode_jwt_key_development_only_2026!
      CORS_ORIGIN: http://localhost:5173
      UPLOAD_DIR: /app/uploads
    ports:
      - "3001:3001"
    volumes:
      - class_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fatecode_network

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: fatecode_worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fatecode?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fatecode_network

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: fatecode_web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - fatecode_network

volumes:
  postgres_data:
  redis_data:
  class_uploads:

networks:
  fatecode_network:
    driver: bridge
